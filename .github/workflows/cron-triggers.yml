name: Cron Triggers (manual)

# QStash now owns the actual scheduling (see src/lib/cron-auth.ts and the
# QStash schedules created against these same endpoints) — GH Actions'
# `schedule` trigger was dropping the majority of its own ticks under load
# (median gap ~36min against a nominal 15min), which is why this moved.
#
# This workflow is kept as a manual-only fallback (workflow_dispatch) for
# hitting the cron endpoints by hand — e.g. to force a sync/digest without
# waiting for the next QStash tick. It authenticates with CRON_SECRET rather
# than a QStash signature, which the routes accept as a secondary path for
# exactly this kind of manual call.
#
# Uses the *.vercel.app production domain rather than the custom domain:
# controlledchaos.adhdesigns.dev is proxied through Cloudflare, whose bot/
# managed-challenge protection blocks GitHub Actions' shared runner IPs
# before the request reaches Vercel. The vercel.app domain isn't proxied.
#
# The actual QStash schedules (cron cadence, destination, retries) live in
# the Upstash console/API only — nothing in this repo enforces them, which is
# how they silently inherited GH Actions' old off-round-minute offset
# (7,22,37,52 — a congestion dodge QStash doesn't need) and added up to 15min
# of pure delivery lag. Canonical cadence as of 2026-09-20:
#   push-triggers:   */10 * * * * (was */2 — that 7.5x tick rate on the
#                     most expensive route, per-user AI generation, spiked
#                     Vercel CPU billing; */10 still fixes the offset lag.
#                     Left at */10 in the 2026-09-20 retune: it drives the
#                     "time to start" nudges, which are the point of the app.)
#   calendar-sync:   */30 * * * *         (was */15)
#   morning-digest:  */15 6-16 * * *      (6am-4pm UTC window; was */5)
#   evening-digest:  */15 22-23,0-4 * * * (10pm-4am UTC window; was */5)
#
# The 2026-09-20 retune: the digest pollers were firing 216 times a day to
# send two emails, each tick a cold Node function loading resend +
# @react-email/components + the query layer before almost always bailing.
# Module-init CPU dwarfed the actual work. */15 caps a digest's lateness at
# 15 minutes, which is invisible for a "here is your day" email. Total cron
# invocations: 456/day -> 264/day.
# Verify/update via `GET/POST https://qstash-us-east-1.upstash.io/v2/schedules`.

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Calendar sync
        run: |
          curl -fsS -X POST "https://controlledchaos-app.vercel.app/api/cron/calendar-sync" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Push triggers
        run: |
          curl -fsS -X POST "https://controlledchaos-app.vercel.app/api/cron/push-triggers" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Morning digest
        run: |
          curl -fsS -X POST "https://controlledchaos-app.vercel.app/api/cron/morning-digest" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Evening digest
        run: |
          curl -fsS -X POST "https://controlledchaos-app.vercel.app/api/cron/evening-digest" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
